<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сам збіраю — Фермы и дачи Минской области</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --earth:   #1e1408;
      --bark:    #5c3d1e;
      --leaf:    #3b6d11;
      --sage:    #639922;
      --cream:   #faf9f6;
      --mist:    #eaf3de;
      --amber:   #faeeda;
      --amber-dark: #633806;
      --red-soft: #fcebeb;
      --red-dark: #791f1f;
      --border:  rgba(30,20,8,.09);
      --radius:  16px;
      --radius-sm: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Geologica', sans-serif;
      background: var(--cream);
      color: var(--earth);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ── HERO (light, centered) ──────────────────────────── */
    .hero {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 22px 20px 26px;
    }
    .nav {
      max-width: 760px;
      margin: 0 auto 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--leaf);
      font-weight: 500;
    }
    .add-btn {
      background: var(--leaf);
      color: white;
      border-radius: 50px;
      padding: 9px 18px;
      font-size: .8rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background .2s;
    }
    .add-btn:hover { background: var(--sage); }

    .hero-center {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }
    .hero-tag {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 6vw, 2.8rem);
      color: var(--earth);
      line-height: 1.15;
      margin-bottom: 10px;
    }
    h1 em { font-style: italic; color: var(--leaf); }
    .hero-sub {
      font-size: .9rem;
      font-weight: 300;
      color: rgba(30,20,8,.55);
      margin-bottom: 22px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 6px 6px 18px;
      gap: 8px;
      max-width: 500px;
      margin: 0 auto;
    }
    .search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--earth);
      font-family: 'Geologica', sans-serif;
      font-size: .9rem;
    }
    .search-input::placeholder { color: rgba(30,20,8,.35); }
    .search-clear {
      color: rgba(30,20,8,.35);
      font-size: 1rem;
      padding: 0 4px;
      display: none;
    }
    .search-clear.visible { display: block; }
    .search-btn {
      background: var(--leaf);
      color: white;
      border-radius: 50px;
      padding: 9px 20px;
      font-size: .8rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background .2s;
    }
    .search-btn:hover { background: var(--sage); }

    /* ── CHIPS ──────────────────────────────────────────── */
    .chips-wrap {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 16px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--cream);
      font-size: .78rem;
      color: var(--earth);
      white-space: nowrap;
      transition: all .18s;
    }
    .chip:hover, .chip.active {
      background: var(--leaf);
      border-color: var(--leaf);
      color: white;
    }

    /* ── MAIN ───────────────────────────────────────────── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    .count-label {
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(30,20,8,.4);
      margin-bottom: 20px;
    }

    /* ── FARM CARD ──────────────────────────────────────── */
    .farm-card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(30,20,8,.05);
      margin-bottom: 20px;
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .farm-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(30,20,8,.09);
    }

    .farm-header {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    .farm-photo {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: var(--mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .farm-photo img { width: 100%; height: 100%; object-fit: cover; }
    .farm-info { flex: 1; min-width: 0; }
    .farm-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .farm-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--earth);
    }
    .farm-name.clickable {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(59,109,17,.35);
      text-underline-offset: 3px;
    }
    .farm-name.clickable:hover { color: var(--leaf); }
    .farm-badge {
      background: var(--mist);
      color: var(--leaf);
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 50px;
    }
    .farm-meta {
      font-size: .78rem;
      color: rgba(30,20,8,.45);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── DETAIL PANEL (expandable) ─────────────────────── */
    .farm-detail {
      display: none;
      padding: 14px 18px;
      background: var(--mist);
      border-bottom: 1px solid var(--border);
      font-size: .85rem;
      font-weight: 300;
      color: rgba(30,20,8,.75);
      line-height: 1.6;
    }
    .farm-detail.open { display: block; }

    /* ── CROP ROWS ──────────────────────────────────────── */
    .crop-list { display: flex; flex-direction: column; }
    .crop-row {
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .crop-row:last-child { border-bottom: none; }
    .crop-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .crop-name { font-size: .92rem; font-weight: 500; color: var(--earth); display: flex; align-items: center; gap: 6px; }
    .crop-price { font-size: .82rem; color: var(--bark); white-space: nowrap; flex-shrink: 0; }
    .crop-meta { font-size: .76rem; color: rgba(30,20,8,.45); display: flex; align-items: center; gap: 5px; }

    .season-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 500; padding: 3px 10px; border-radius: 50px; width: fit-content; }
    .season-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .season-ok   { background: var(--mist);     color: #27500a; }
    .season-ok   .season-dot { background: #639922; }
    .season-soon { background: var(--amber);    color: var(--amber-dark); }
    .season-soon .season-dot { background: #ba7517; }
    .season-last { background: var(--red-soft); color: var(--red-dark); }
    .season-last .season-dot { background: #e24b4a; }

    /* ── HIDDEN CROPS — EXPANDABLE LINK ────────────────── */
    .hidden-note {
      padding: 9px 18px;
      font-size: .78rem;
      color: var(--leaf);
      background: white;
      border-top: 1px solid var(--border);
      cursor: pointer;
      display: none;
      font-weight: 500;
    }
    .hidden-note:hover { background: var(--mist); }
    .hidden-note .chev { display: inline-block; transition: transform .2s; margin-left: 4px; }
    .hidden-note.expanded .chev { transform: rotate(180deg); }

    /* ── FARM FOOTER ────────────────────────────────────── */
    .farm-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 18px;
      background: var(--cream);
      border-top: 1px solid var(--border);
    }
    .btn-map {
      flex: 0 0 auto;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: .76rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid var(--border);
      color: var(--bark);
      white-space: nowrap;
      transition: all .18s;
    }
    .btn-map:hover { border-color: var(--leaf); color: var(--leaf); }
    .btn-contact {
      flex: 0 0 auto;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: .76rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(59,109,17,.35);
      color: var(--leaf);
      white-space: nowrap;
      overflow: hidden;
      transition: background .18s;
    }
    .btn-contact:hover { background: var(--mist); }

    /* ── EMPTY / LOADING STATES ─────────────────────────── */
    .state-box { text-align: center; padding: 24px 20px; display: none; }
    .state-box.visible { display: block; }
    .state-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .state-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 8px; }
    .state-sub { font-size: .95rem; color: rgba(30,20,8,.5); margin-bottom: 20px; }
    .state-reset {
      background: none;
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 9px 22px;
      font-size: .82rem;
      color: var(--bark);
      transition: all .18s;
    }
    .state-reset:hover { border-color: var(--leaf); color: var(--leaf); }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--mist);
      border-top-color: var(--leaf);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ─────────────────────────────────────────── */
    .site-footer {
      background: white;
      border-top: 1px solid var(--border);
      color: rgba(30,20,8,.45);
      text-align: center;
      padding: 24px 20px;
      font-size: .78rem;
      font-weight: 300;
    }
    .site-footer a { color: var(--leaf); }

    @media (max-width: 500px) {
      .farm-footer { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header class="hero">
  <nav class="nav">
    <div class="logo">🌿 Сам збіраю</div>
    <a href="dobavit.html" class="add-btn">+ Добавить</a>
  </nav>
  <div class="hero-center">
    <div class="hero-tag">Минская область · самосбор</div>
    <h1>Свежее прямо<br/><em>с грядки</em></h1>
    <p class="hero-sub">Фермы и дачи, где можно самому собрать фрукты и овощи. Без посредников.</p>
    <div class="search-wrap">
      <input
        class="search-input"
        id="searchInput"
        type="text"
        placeholder="Что ищете?"
        oninput="handleSearch(this.value)"
        autocomplete="off"
      />
      <button class="search-clear" id="clearBtn" onclick="clearSearch()" aria-label="Сбросить поиск">✕</button>
      <button class="search-btn" onclick="handleSearch(document.getElementById('searchInput').value)">Найти</button>
    </div>
  </div>
</header>

<div class="chips-wrap" id="chipsWrap">
  <button class="chip active" onclick="chipFilter('')">Все</button>
  <button class="chip" onclick="chipFilter('клубника')">🍓 Клубника</button>
  <button class="chip" onclick="chipFilter('малина')">🍒 Малина</button>
  <button class="chip" onclick="chipFilter('смородина')">🍇 Смородина</button>
  <button class="chip" onclick="chipFilter('черника')">🟣 Черника</button>
  <button class="chip" onclick="chipFilter('груша')">🍐 Груши</button>
  <button class="chip" onclick="chipFilter('слива')">🍑 Сливы</button>
  <button class="chip" onclick="chipFilter('огурцы')">🥒 Огурцы</button>
  <button class="chip" onclick="chipFilter('помидоры')">🍅 Помидоры</button>
  <button class="chip" onclick="chipFilter('яблоки')">🍎 Яблоки</button>
  <button class="chip" onclick="chipFilter('картофель')">🥔 Картофель</button>
  <button class="chip" onclick="chipFilter('морковь')">🥕 Морковь</button>
  <button class="chip" onclick="chipFilter('перец')">🌶️ Перец</button>
</div>

<main class="main">
  <p class="count-label" id="countLabel">Загрузка…</p>

  <div class="state-box visible" id="loadingState">
    <div class="loading-spinner"></div>
    <p class="state-sub">Загружаем объявления…</p>
  </div>

  <div class="state-box" id="emptyState">
    <div class="state-icon">🌱</div>
    <p class="state-title">Ничего не найдено</p>
    <p class="state-sub">Попробуйте другой запрос</p>
    <button class="state-reset" onclick="clearSearch()">Сбросить поиск</button>
  </div>

  <div id="farmsContainer"></div>
</main>

<footer class="site-footer">
  <p>🌿 Сам збіраю · Минская область · <a href="dobavit.html">Добавить объявление</a></p>
</footer>

<script>
// ── CONFIG ─────────────────────────────────────────────────
const SHEET_ID   = '19MDUt1i18ZOG82g7pIN_4SNhMvS8_bTJXTxSD5T0_no';
const FARMS_GID  = '1654926053';
const CROPS_GID  = '605337108';

const FARMS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&gid=${FARMS_GID}`;
const CROPS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&gid=${CROPS_GID}`;

const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.getDate() + ' ' + MONTHS[dt.getMonth()];
}

function seasonStatus(from, to) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const end = to ? new Date(to) : null;
  if (!end) return null;
  if (today > end) return { type: 'expired' };
  const daysLeft = Math.round((end - today) / 86400000);
  if (daysLeft === 0) return { type: 'last', label: 'Последний день — сегодня!' };
  if (daysLeft <= 7) return { type: 'soon', label: `Заканчивается ${fmtDate(to)} · ${daysLeft} ${daysLeft===1?'день':daysLeft<5?'дня':'дней'}` };
  return { type: 'ok', label: `До ${fmtDate(to)}` };
}

function seasonBadge(from, to) {
  const s = seasonStatus(from, to);
  if (!s || s.type === 'expired') return '';
  const cls = s.type === 'ok' ? 'season-ok' : s.type === 'soon' ? 'season-soon' : 'season-last';
  return `<span class="season-badge ${cls}"><span class="season-dot"></span>${s.label}</span>`;
}

function mapIcon(type) {
  return type && type.toLowerCase().includes('яндекс') ? '🗺' : '📍';
}

function parseSheet(raw) {
  const json = JSON.parse(raw.replace(/^[^{]*/, '').replace(/[^}]*$/, ''));
  const cols = json.table.cols.map(c => c.label);
  return json.table.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => {
      obj[cols[i]] = cell ? (cell.f || cell.v) : '';
    });
    return obj;
  });
}

let allFarms  = [];
let allCrops  = [];
let query     = '';
let expandedFarms = new Set();

async function fetchSheet(url) {
  const res  = await fetch(url);
  const text = await res.text();
  return parseSheet(text);
}

async function loadData() {
  try {
    const [farms, crops] = await Promise.all([
      fetchSheet(FARMS_URL),
      fetchSheet(CROPS_URL)
    ]);
    allFarms = farms.filter(f => String(f['Одобрено']).toUpperCase() === 'TRUE');
    allCrops = crops.filter(c => String(c['Одобрено']).toUpperCase() === 'TRUE');
    document.getElementById('loadingState').classList.remove('visible');
    render();
  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      '<div class="state-icon">⚠️</div><p class="state-title">Не удалось загрузить данные</p><p class="state-sub">Проверьте подключение к интернету и попробуйте снова.</p>';
    console.error(e);
  }
}

function toggleHidden(farmId) {
  if (expandedFarms.has(farmId)) expandedFarms.delete(farmId);
  else expandedFarms.add(farmId);
  render();
}

function toggleDetail(farmId) {
  const el = document.getElementById('detail-' + farmId);
  if (el) el.classList.toggle('open');
}

function render() {
  const container = document.getElementById('farmsContainer');
  const emptyState = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');
  const q = query.toLowerCase().trim();

  container.innerHTML = '';
  let visibleFarms = 0;

  allFarms.forEach(farm => {
    const farmID = String(farm['FermaID'] || '');
    let crops = allCrops.filter(c => String(c['FermaID'] || '').trim() === farmID.trim());

    crops = crops.filter(c => {
      const s = seasonStatus(c['Сезон с'], c['Сезон по']);
      return !s || s.type !== 'expired';
    });

    if (crops.length === 0) return;

    let visibleCrops = crops;
    let hiddenCrops  = [];

    if (q) {
      const farmMatch = (farm['Название / Имя'] || '').toLowerCase().includes(q);
      if (!farmMatch) {
        visibleCrops = crops.filter(c => (c['Культура'] || '').toLowerCase().includes(q));
        hiddenCrops  = crops.filter(c => !(c['Культура'] || '').toLowerCase().includes(q));
      }
      if (visibleCrops.length === 0) return;
    }

    visibleFarms++;

    const isExpanded = expandedFarms.has(farmID);
    const cropsToShow = (q && hiddenCrops.length > 0 && isExpanded) ? crops : visibleCrops;

    const cropRowsHTML = cropsToShow.map(c => {
      const badge = seasonBadge(c['Сезон с'], c['Сезон по']);
      const sched = [c['Дни'], c['Время']].filter(Boolean).join(' · ');
      const priceDetail = c['Цена (подробнее)'] || '';
      const priceStr = priceDetail ? priceDetail : (c['Условия оплаты'] || '');
      return `
        <div class="crop-row">
          <div class="crop-top">
            <span class="crop-name">${cropEmoji(c['Культура'])} ${c['Культура'] || ''}</span>
            <span class="crop-price">${priceStr}</span>
          </div>
          ${sched ? `<div class="crop-meta">🕐 ${sched}</div>` : ''}
          ${badge}
        </div>`;
    }).join('');

    let hiddenNote = '';
    if (q && hiddenCrops.length > 0) {
      hiddenNote = `<div class="hidden-note ${isExpanded ? 'expanded' : ''}" onclick="toggleHidden('${farmID}')">
        ${isExpanded ? 'Скрыть' : 'Ещё ' + hiddenCrops.length + ' ' + cropWord(hiddenCrops.length) + ' от этого хозяйства'}
        <span class="chev">▾</span>
      </div>`;
    }

    const photo = farm['Фото (URL)']
      ? `<img src="${farm['Фото (URL)']}" alt="${farm['Название / Имя']}" loading="lazy" />`
      : photoEmoji(farm['Тип хозяйства']);

    const mapLabel = farm['Тип карты'] || 'Карта';
    const mapLink  = farm['Ссылка на карту'] || '#';
    const phone    = farm['Телефон'] || '';
    const tg       = farm['Telegram'] || '';
    const viber    = farm['Viber'] || '';
    const dist     = farm['Расстояние от Минска'] || '';
    const desc     = farm['Описание'] || '';
    const hasDesc  = desc && desc.trim().length > 0;

    const nameHTML = hasDesc
      ? `<span class="farm-name clickable" onclick="toggleDetail('${farmID}')">${farm['Название / Имя'] || ''}</span>`
      : `<span class="farm-name">${farm['Название / Имя'] || ''}</span>`;

    const detailHTML = hasDesc
      ? `<div class="farm-detail" id="detail-${farmID}">${desc}</div>`
      : '';

    // Contact buttons — show ALL methods the farmer provided
    let contactBtns = '';
    if (phone)  contactBtns += `<a href="tel:${phone.replace(/\s/g,'')}" class="btn-contact">📞 ${phone}</a>`;
    if (tg)     contactBtns += `<a href="https://t.me/${tg.replace('@','')}" target="_blank" rel="noopener" class="btn-contact">✈️ ${tg}</a>`;
    if (viber)  contactBtns += `<a href="viber://chat?number=${viber.replace(/\s/g,'')}" class="btn-contact">💜 ${viber}</a>`;

    container.innerHTML += `
      <article class="farm-card">
        <div class="farm-header">
          <div class="farm-photo">${photo}</div>
          <div class="farm-info">
            <div class="farm-name-row">
              ${nameHTML}
              <span class="farm-badge">${farm['Тип хозяйства'] || ''}</span>
            </div>
            ${dist ? `<div class="farm-meta">📍 ${dist} от центра Минска</div>` : ''}
          </div>
        </div>
        ${detailHTML}
        <div class="crop-list">${cropRowsHTML}</div>
        ${hiddenNote}
        <div class="farm-footer">
          ${mapLink && mapLink !== '#'
            ? `<a href="${mapLink}" target="_blank" rel="noopener" class="btn-map">${mapIcon(mapLabel)} ${mapLabel}</a>`
            : ''}
          ${contactBtns}
        </div>
      </article>`;
  });

  if (q) {
    countLabel.textContent = visibleFarms === 0
      ? ''
      : `${visibleFarms} ${farmWord(visibleFarms)} · Минская область`;
  } else {
    countLabel.textContent = `${visibleFarms} ${farmWord(visibleFarms)} · Минская область`;
  }

  emptyState.classList.toggle('visible', visibleFarms === 0);
}

function cropEmoji(name) {
  if (!name) return '🌿';
  const n = name.toLowerCase();
  if (n.includes('клубник')) return '🍓';
  if (n.includes('малин'))   return '🍒';
  if (n.includes('смородин'))return '🍇';
  if (n.includes('черник'))  return '🟣';
  if (n.includes('огурц'))   return '🥒';
  if (n.includes('помидор') || n.includes('томат')) return '🍅';
  if (n.includes('перец'))   return '🌶️';
  if (n.includes('яблок'))   return '🍎';
  if (n.includes('груш'))    return '🍐';
  if (n.includes('слив'))    return '🍑';
  if (n.includes('картоф'))  return '🥔';
  if (n.includes('морков'))  return '🥕';
  if (n.includes('кабачк'))  return '🥬';
  if (n.includes('свёкл') || n.includes('свекл')) return '🫚';
  if (n.includes('зелен'))   return '🌿';
  return '🌱';
}

function photoEmoji(type) {
  return type && type.toLowerCase().includes('ферм') ? '🚜' : '🏡';
}

function cropWord(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'культура';
  if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'культуры';
  return 'культур';
}

function farmWord(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'хозяйство';
  if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'хозяйства';
  return 'хозяйств';
}

function handleSearch(val) {
  query = val;
  expandedFarms.clear();
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.classList.toggle('visible', val.length > 0);
  render();
}

function clearSearch() {
  query = '';
  expandedFarms.clear();
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('visible');
  document.querySelectorAll('.chip').forEach((c,i) => c.classList.toggle('active', i===0));
  render();
}

function chipFilter(term) {
  query = term;
  expandedFarms.clear();
  document.getElementById('searchInput').value = term;
  document.getElementById('clearBtn').classList.toggle('visible', term.length > 0);
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.textContent.trim().toLowerCase().includes(term) || (term === '' && c.textContent.trim() === 'Все'));
  });
  render();
}

loadData();
</script>
</body>
</html>
